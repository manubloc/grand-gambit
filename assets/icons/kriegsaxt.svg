<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" data-gg="icon:kriegsaxt">
  <!-- KRIEGSAXT, vierter Anlauf. Pilz, Fahne, Scheibe - der Fehler war jedes
       Mal derselbe: das Blatt war rund statt geschnitten. Eine Axt erkennt
       man an der EINGEZOGENEN Taille am Schaft und der weit ausholenden
       Schneide: oben und unten laeuft das Blatt konkav aus, aussen bildet es
       einen Bogen mit Spitzen (Bart und Horn). -->
  <rect x="8.6" y="2.4" width="2.8" height="27.2" rx="1.3" fill="#a3803c"/>
  <path d="M11 4.2 L14.6 5 q6 1.6 8.6 5.4 q1.8 2.6 1.8 5.4 q0 2.8-1.8 5.4 q-2.6 3.8-8.6 5.4 L11 27.2
           q3-4.2 3-11 q0-6.8-3-12z" fill="#dcbb78"/>
  <path d="M13.6 7.4 q5 1.8 7.2 4.8 q1.4 2 1.4 3.8 q0 1.8-1.4 3.8 q-2.2 3-7.2 4.8 q1.4-4 1.4-8.6 q0-4.6-1.4-8.6z"
        fill="#f8e7b4" opacity=".38"/>
  <path d="M8.6 10.4 q-3.4 0-4.8 2.6 q2.2 1.2 2.4 3 q-.2 1.8-2.4 3 q1.4 2.6 4.8 2.6z" fill="#dcbb78" opacity=".8"/>
  <rect x="7.4" y="27.6" width="5.2" height="2.4" rx="1.1" fill="#a3803c"/>
</svg>
